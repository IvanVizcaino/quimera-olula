name: testeo

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testeo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          # Fijado a 24: desde Node 25 el localStorage nativo de Node tapa el de
          # jsdom y los tests que lo usan fallan.
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Lanzar Checks
        run: pnpm run ci
