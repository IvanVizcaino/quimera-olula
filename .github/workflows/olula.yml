name: Olula

# Olula SaaS: front app (olula.app) y front backoffice (admin.olula.app).
# Despliegue: despliegue_kubernetes.yaml (saas-deployment y saas-admin-deployment).
# Las VITE_* se fijan al construir: cada imagen lleva sus URLs.

# Aqui indicaremos el nombre de la rama sobre la cual al hacer push se iniciara el proceso de despliegue automatico
on:
  push:
    branches:
      - Deploy_Olula

env:
  API_URL: https://api.olula.app
  API_ADMIN_URL: https://api-admin.olula.app

jobs:
  Docker:
    if: ${{ github.ref_name == 'Deploy_Olula' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "yeboyebo/quimera-olula"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependecies
        run: pnpm install

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.YB_DOCKERHUB_USERNAME }}
          password: ${{ secrets.YB_DOCKERHUB_PASSWORD }}

      # --- Front app (olula.app) ---
      - name: Make envfile app
        run: |
          {
            echo "VITE_API_URL=$API_URL"
            echo "VITE_API_SAAS_ADMIN_URL=$API_ADMIN_URL"
          } > ./apps/olula_saas/.env

      - name: Build app
        run: pnpm run --filter @olula/olula_saas build

      - name: Mover dist app
        run: rm -rf ./dist && mv ./apps/olula_saas/dist ./dist

      - name: Build and push app
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: yeboyebohub/saas_cli:${{ github.sha }}

      # --- Front backoffice (admin.olula.app) ---
      - name: Make envfile admin
        run: echo "VITE_API_URL=$API_ADMIN_URL" > ./apps/olula_saas_admin/.env

      - name: Build admin
        run: pnpm run --filter @olula/olula_saas_admin build

      - name: Mover dist admin
        run: rm -rf ./dist && mv ./apps/olula_saas_admin/dist ./dist

      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: yeboyebohub/saas_admin_cli:${{ github.sha }}

  deploy-to-cluster:
    name: deploy to cluster
    if: ${{ github.ref_name == 'Deploy_Olula' }}
    runs-on: ubuntu-latest
    needs: Docker
    steps:
      - name: deploy app
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG_DATA }}
          command: -n default set image --record deployment/saas-deployment app=yeboyebohub/saas_cli:${{ github.sha }}

      - name: deploy admin
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG_DATA }}
          command: -n default set image --record deployment/saas-admin-deployment admin=yeboyebohub/saas_admin_cli:${{ github.sha }}

      - name: verify app
        uses: steebchen/kubectl@v2.0.0
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          KUBECTL_VERSION: "1.28"
        with:
          config: ${{ secrets.KUBE_CONFIG_DATA }}
          command: -n default rollout status deployment/saas-deployment

      - name: verify admin
        uses: steebchen/kubectl@v2.0.0
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          KUBECTL_VERSION: "1.28"
        with:
          config: ${{ secrets.KUBE_CONFIG_DATA }}
          command: -n default rollout status deployment/saas-admin-deployment
